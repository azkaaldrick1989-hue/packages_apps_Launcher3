name: Android CI

on:
  push:
    branches: [ "cnb" ]
  pull_request:
    branches: [ "cnb" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "File gradlew belum ditemukan di root repositori. Pastikan struktur Gradle sudah ditambahkan."
            exit 1
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Launcher3-Debug-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: ignore
