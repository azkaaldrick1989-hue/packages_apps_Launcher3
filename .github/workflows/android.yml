name: Android CI

on:
  push:
    branches: [ "cnb" ]
  pull_request:
    branches: [ "cnb" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Patch private AOSP color references
        run: |
          find res quickstep/res -type f -name "*.xml" -exec sed -i -E \
            -e 's/@\*?androidprv:color\/shade_panel_/@color\/shade_panel_/g' \
            -e 's/@\*?android:color\/system_/@color\/system_/g' {} +
          grep -rnE "shade_panel_|system_(error_dim|inverse_|palette_key_color_error|primary_dim|scrim|secondary_dim|shadow)" res quickstep/res || true

      - name: Build with Gradle
        run: gradle assembleQuickstepDebug --stacktrace

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Launcher3-Debug-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: ignore
