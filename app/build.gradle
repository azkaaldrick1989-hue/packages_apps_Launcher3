plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.protobuf'
}

android {
    namespace 'com.android.launcher3'
    compileSdk 35

    defaultConfig {
        applicationId "com.android.launcher3.reborn"
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    flavorDimensions "variant"
    productFlavors {
        quickstep {
            dimension "variant"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        aidl true
    }

    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
            java.srcDirs = [
                '../src',
                '../src_shortcuts_overrides',
                '../src_ui_overrides',
                '../shared/src'
            ]
            res.srcDirs = ['src/main/res', '../res']
            assets.srcDirs = ['../assets']
            proto {
                srcDir '../protos'
                srcDir '../protos_overrides'
            }
        }
        quickstep {
            java.srcDirs = ['../quickstep/src']
            res.srcDirs = ['../quickstep/res']
            aidl.srcDirs = ['../quickstep/src']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

def hiddenFrameworkJar = file('libs/framework-hidden.jar')
if (hiddenFrameworkJar.exists()) {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add("-Xbootclasspath/p:${hiddenFrameworkJar.absolutePath}")
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            freeCompilerArgs += ["-Xfriend-paths=${hiddenFrameworkJar.absolutePath}"]
        }
        classpath = files(hiddenFrameworkJar) + classpath
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

dependencies {
    // Modul lokal penghasil .jar shim kompatibilitas AOSP
    implementation project(':aosp-compat')

    // Memuat file .jar dan .aar dari folder app/libs/ (kecuali stub framework & duplikat aosp-compat)
    implementation fileTree(
        dir: 'libs',
        include: ['*.jar', '*.aar'],
        exclude: [
            'aosp-compat.jar',
            'framework-hidden.jar',
            'SystemUI-shared.jar',
            'WindowManager-Shell.jar'
        ]
    )

    // Stub framework/hidden-API hanya untuk kompilasi (jika tersedia di app/libs/)
    compileOnly fileTree(
        dir: 'libs',
        include: [
            'framework-hidden.jar',
            'SystemUI-shared.jar',
            'WindowManager-Shell.jar'
        ]
    )

    // Coroutines & Anotasi JSR-305 (@ThreadSafe, @Nullable, dll.)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // AndroidX & Material Core
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.slice:slice-core:1.0.0'
    implementation 'androidx.slice:slice-view:1.0.0'
    implementation 'androidx.window:window:1.3.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.airbnb.android:lottie:6.4.1'

    // Protobuf Lite
    implementation 'com.google.protobuf:protobuf-javalite:3.25.3'

    // Dagger
    implementation 'com.google.dagger:dagger:2.51.1'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.51.1'
}
