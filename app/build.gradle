plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.protobuf'
}

android {
    namespace 'com.android.launcher3'
    compileSdk 35

    defaultConfig {
        applicationId "com.android.launcher3.reborn"
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        aidl true
    }

    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
            java.srcDirs = [
                '../src',
                '../src_shortcuts_overrides',
                '../src_ui_overrides',
                '../quickstep/src',
                '../shared/src'
            ]
            res.srcDirs = [
                '../res',
                '../quickstep/res'
            ]
            assets.srcDirs = ['../assets']
            aidl.srcDirs = ['../quickstep/src']
            proto {
                srcDir '../protos'
                srcDir '../protos_overrides'
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

dependencies {
    // Akan otomatis dimuat jika file .jar sudah ditaruh di app/libs/
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])

    // ... dependensi lainnya tetap sama ...
}

    // AndroidX & Material Core
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.slice:slice-core:1.0.0'
    implementation 'androidx.slice:slice-view:1.0.0'
    implementation 'androidx.window:window:1.3.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Protobuf Lite
    implementation 'com.google.protobuf:protobuf-javalite:3.25.3'

    // Dagger (sering dipakai di Launcher3 modern)
    implementation 'com.google.dagger:dagger:2.51.1'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.51.1'
}
